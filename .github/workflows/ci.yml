name: Emirates API CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run offline collection checks
        run: npm run test:offline

  staging:
    name: Emirates staging collection
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Bruno CLI
        run: npm install --global @usebruno/cli

      - name: Run staging collection
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TEST_USER_EMAIL) -or [string]::IsNullOrWhiteSpace($env:TEST_USER_PASSWORD)) { exit 1 }
          bru run --env Staging --bail --reporter-json reports/github-actions.json --reporter-skip-all-headers --reporter-skip-body
        shell: pwsh
